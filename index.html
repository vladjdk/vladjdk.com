<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vladjdk</title>
<meta name="description" content="vladjdk">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #logo {
    position: fixed;
    top: 0;
    left: 0;
    width: clamp(150px, 22vw, 320px);
    color: #fff;
    will-change: transform;
    user-select: none;
  }
  #logo svg {
    display: block;
    width: 100%;
    height: auto;
  }
  #logo text {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
  }
</style>
</head>
<body>
<div id="logo" role="img" aria-label="vladjdk">
  <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
    <text x="299" y="133" font-size="11" style="font-style: normal" fill="currentColor">TM</text>
    <text x="150" y="78" text-anchor="middle" font-size="84" textLength="288"
          lengthAdjust="spacingAndGlyphs" fill="currentColor">vladjdk</text>
    <ellipse cx="150" cy="118" rx="146" ry="17" fill="currentColor"/>
    <ellipse cx="150" cy="118" rx="22" ry="5" fill="#000"/>
    <text x="150" y="174" text-anchor="middle" font-size="34" textLength="210"
          lengthAdjust="spacing" style="font-style: normal" fill="currentColor">VIDEO</text>
  </svg>
</div>
<script>
(() => {
  const logo = document.getElementById('logo');
  const colors = ['#ff2d2d', '#ff8a00', '#ffe600', '#2dff5c', '#00e5ff', '#2d6bff', '#b04dff', '#ff3db8', '#ffffff'];
  const SPEED = 130; // px per second on each axis

  let w = 0, h = 0, maxX = 0, maxY = 0;
  let x = 0, y = 0, dx = 1, dy = 1;
  let colorIndex = -1;
  let last = null;

  function measure() {
    const r = logo.getBoundingClientRect();
    w = r.width;
    h = r.height;
    maxX = Math.max(0, window.innerWidth - w);
    maxY = Math.max(0, window.innerHeight - h);
    x = Math.min(x, maxX);
    y = Math.min(y, maxY);
  }

  function nextColor() {
    let i;
    do { i = Math.floor(Math.random() * colors.length); } while (i === colorIndex);
    colorIndex = i;
    logo.style.color = colors[i];
  }

  function frame(now) {
    // Clamp dt so a backgrounded tab doesn't teleport the logo on return
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.05);
    if (last === null) {
      // Pick the start here, not at load: the viewport can still be 0x0 then
      measure();
      x = Math.random() * maxX;
      y = Math.random() * maxY;
    }
    last = now;

    x += dx * SPEED * dt;
    y += dy * SPEED * dt;

    let bounced = false;
    if (x <= 0) { x = 0; dx = 1; bounced = true; }
    else if (x >= maxX) { x = maxX; dx = -1; bounced = true; }
    if (y <= 0) { y = 0; dy = 1; bounced = true; }
    else if (y >= maxY) { y = maxY; dy = -1; bounced = true; }
    if (bounced) nextColor();

    logo.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    requestAnimationFrame(frame);
  }

  dx = Math.random() < 0.5 ? -1 : 1;
  dy = Math.random() < 0.5 ? -1 : 1;
  nextColor();
  window.addEventListener('resize', measure);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
